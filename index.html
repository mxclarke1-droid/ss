<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Sleigh GLB Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#viewer {
    width: 100%;
    height: 100%;
}

#status {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;

    padding: 12px 16px;

    background: rgba(0,0,0,.8);
    color: white;

    border-radius: 8px;

    font-size: 15px;
}
</style>
</head>

<body>

<div id="status">
    🛷 Loading SantaSleigh.glb...
</div>

<div id="viewer"></div>


<!-- Three.js -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<!-- GLB loader -->
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- Orbit controls -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

const status =
    document.getElementById("status");


/* =========================================================
   SCENE
   ========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x111111);


/* =========================================================
   CAMERA
   ========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        10000
    );

camera.position.set(
    5,
    3,
    5
);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document
    .getElementById("viewer")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(ambient);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directional.position.set(
    5,
    10,
    5
);

scene.add(directional);


const secondLight =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

secondLight.position.set(
    -5,
    3,
    -5
);

scene.add(secondLight);


/* =========================================================
   CONTROLS
   ========================================================= */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 0.1;

controls.maxDistance = 100;


/* =========================================================
   LOAD SANTA GLB
   ========================================================= */

const loader =
    new THREE.GLTFLoader();

console.log(
    "Loading:",
    new URL(
        "SantaSleigh.glb",
        window.location.href
    ).href
);


loader.load(

    "SantaSleigh.glb",

    function(gltf) {

        console.log(
            "SUCCESS:",
            gltf
        );

        const model =
            gltf.scene;

        scene.add(model);


        /* =================================================
           FIND MODEL SIZE
           ================================================= */

        const box =
            new THREE.Box3()
            .setFromObject(model);

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        console.log(
            "Model size:",
            size
        );


        /* =================================================
           CENTER MODEL
           ================================================= */

        model.position.x -=
            center.x;

        model.position.y -=
            center.y;

        model.position.z -=
            center.z;


        /* =================================================
           AUTOMATIC CAMERA DISTANCE
           ================================================= */

        const maxSize =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        const distance =
            maxSize * 2.5;

        camera.position.set(
            distance,
            distance * .6,
            distance
        );

        camera.lookAt(
            0,
            0,
            0
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();


        /* =================================================
           SHOW SUCCESS
           ================================================= */

        status.textContent =
            "✅ SantaSleigh.glb loaded successfully!";

        status.style.background =
            "rgba(0,100,40,.9)";


        /* =================================================
           MAKE SURE MESHES ARE VISIBLE
           ================================================= */

        model.traverse(
            function(object) {

                if(object.isMesh) {

                    object.frustumCulled =
                        false;

                    if(object.material) {

                        object.material.needsUpdate =
                            true;
                    }
                }
            }
        );

    },

    function(xhr) {

        if(xhr.total) {

            const percent =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );

            status.textContent =
                "🛷 Loading SantaSleigh.glb... " +
                percent +
                "%";
        }

    },

    function(error) {

        console.error(
            "GLB ERROR:",
            error
        );

        status.textContent =
            "❌ SantaSleigh.glb FAILED TO LOAD";

        status.style.background =
            "rgba(130,0,0,.9)";
    }

);


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
